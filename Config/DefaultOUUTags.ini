[/Script/OUUTagsEditor.GameplayTagValidationSettings]
; 本项目的 GameplayTag 层级由 DefaultGameplayTags.ini 定义，不要求根标签必须在 C++ 中声明为 native tag。
bAllowContentRootTags=True
bDefaultAllowContentTagChildren=True
; OUUTestTags 是 OUUTags 插件自带的测试标签，其根标签显式禁止内容子标签，
; 上面两个开关对它无效，降级为警告以免污染校验结果。
WarnOnlyGameplayTags=(GameplayTags=((TagName="OUUTestTags")))
